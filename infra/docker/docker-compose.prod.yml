version: "3.9"

services:
  backend:
    restart: always
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
    command: uv run uvicorn src.api.app:app --host 0.0.0.0 --port 8000 --workers 4

  frontend:
    restart: always
    command: npm run build && npm start

  celery-worker:
    restart: always
    command: uv run celery -A src.workers.celery_app worker -l warning -Q default,scraping,enrichment,ai,outreach --concurrency=4

  celery-beat:
    restart: always
    command: uv run celery -A src.workers.celery_app beat -l warning

  postgres:
    restart: always
    environment:
      POSTGRES_INITDB_ARGS: "--data-checksums"

  redis:
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  elasticsearch:
    restart: always
    environment:
      - xpack.security.enabled=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - grafana_data:/var/lib/grafana
    restart: always

volumes:
  grafana_data:
