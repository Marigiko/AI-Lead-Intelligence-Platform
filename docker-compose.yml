services:
  # ── Backend ──────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-leadplatform}:${POSTGRES_PASSWORD:-leadplatform}@postgres:5432/${POSTGRES_DB:-leadplatform}
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.longcat.chat/openai/v1}
      - AI_DEFAULT_MODEL=${AI_DEFAULT_MODEL:-LongCat-2.0}
      - AI_SMART_MODEL=${AI_SMART_MODEL:-LongCat-2.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
    command: uv run uvicorn src.api.app:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Frontend ─────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    env_file:
      - frontend/.env
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    restart: unless-stopped

  # ── Celery Worker ────────────────────────────────────────
  celery-worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    env_file:
      - backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-leadplatform}:${POSTGRES_PASSWORD:-leadplatform}@postgres:5432/${POSTGRES_DB:-leadplatform}
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.longcat.chat/openai/v1}
      - AI_DEFAULT_MODEL=${AI_DEFAULT_MODEL:-LongCat-2.0}
      - AI_SMART_MODEL=${AI_SMART_MODEL:-LongCat-2.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    command: uv run celery -A src.workers.celery_app worker -l info -Q default,scraping,enrichment,ai,outreach
    restart: unless-stopped

  # ── Celery Beat (Scheduler) ──────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    env_file:
      - backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-leadplatform}:${POSTGRES_PASSWORD:-leadplatform}@postgres:5432/${POSTGRES_DB:-leadplatform}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    command: uv run celery -A src.workers.celery_app beat -l info
    restart: unless-stopped

  # ── PostgreSQL ───────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadplatform}
      POSTGRES_DB: ${POSTGRES_DB:-leadplatform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # WSL2 optimization: fsync=off dramatically speeds up initialization
    # Safe for development (risk of data loss only on power failure)
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c checkpoint_timeout=30min
    # WSL2-compatible healthcheck (pg_isready unreliable in WSL2)
    healthcheck:
      test: ["CMD-SHELL", "su - postgres -c \"psql -U ${POSTGRES_USER:-leadplatform} -d ${POSTGRES_DB:-leadplatform} -c 'SELECT 1'\" > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 300s
    restart: unless-stopped

  # ── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Elasticsearch (optional) ─────────────────────────────
  elasticsearch:
    image: elasticsearch:8.15.0
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── MinIO (S3-compatible object storage) ─────────────────
  minio:
    image: minio/minio
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  es_data:
  minio_data:
