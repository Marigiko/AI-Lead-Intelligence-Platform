name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        working-directory: backend
        run: uv sync --extra dev
      - name: Ruff lint
        working-directory: backend
        run: uv run ruff check src tests
      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check src tests
      - name: Type check
        working-directory: backend
        run: uv run pyright src

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: leadplatform
          POSTGRES_PASSWORD: leadplatform
          POSTGRES_DB: leadplatform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://leadplatform:leadplatform@localhost:5432/leadplatform_test
      TEST_DATABASE_URL: postgresql+asyncpg://leadplatform:leadplatform@localhost:5432/leadplatform_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: test-secret
      ENVIRONMENT: testing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        working-directory: backend
        run: uv sync --extra dev
      - name: Run migrations
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Run tests
        working-directory: backend
        run: uv run pytest -v --tb=short
