[project]
name = "ai-lead-platform"
version = "0.1.0"
description = "AI Lead Intelligence Platform — Automated B2B sales pipeline"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Validation
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-oauth2>=1.1.1",
    # Redis
    "redis[hiredis]>=5.1.0",
    "aioredis>=2.0.0",
    # HTTP client
    "httpx>=0.27.0",
    "httpx-oauth>=0.13.0",
    # Email
    "aiosmtplib>=3.0.0",
    # Task queue
    "celery[redis]>=5.4.0",
    # AI
    "litellm>=1.49.0",
    "openai>=1.50.0",
    # Scraping
    "playwright>=1.48.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    # Contact enrichment
    "phonenumbers>=8.13.0",
    "dnspython>=2.7.0",
    "email-validator>=2.1.0",
    # MCP server
    "mcp>=1.0.0",
    # Search
    "elasticsearch[async]>=8.15.0",
    # Utilities
    "orjson>=3.10.0",
    "python-dateutil>=2.9.0",
    "geopy>=2.4.0",
    "rapidfuzz>=3.10.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    # i18n
    "babel>=2.16.0",
    # Monitoring
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",  # TestClient
    "ruff>=0.7.0",
    "pyright>=1.1.380",
    "mypy>=1.12.0",
]

[project.scripts]
lead-mcp = "src.mcp.server:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A", "COM", "C4", "DTZ", "ISC", "ICN", "PIE", "PT", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA"]
ignore = ["S101", "COM812", "ISC001"]

[tool.ruff.lint.per-file-ignores]
# FastAPI injects route handler dependencies (CurrentUser, DBSession) that are
# often unused, and `Depends()` in defaults is the idiomatic DI pattern.
"src/api/**" = ["ARG001", "ARG002", "B008"]
# Mock-data generator for local directory scraping; randomness is intentional.
"src/infrastructure/scraping/plugins/local_directory.py" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnknownVariableType = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
